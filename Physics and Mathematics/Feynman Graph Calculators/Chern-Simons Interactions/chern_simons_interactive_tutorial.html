<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chern-Simons Action Explainer</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bio: {
                            dark: '#0B0F19',
                            card: '#1A2235',
                            accent: '#3B82F6',
                            glow: '#60A5FA',
                            text: '#E2E8F0',
                            muted: '#94A3B8'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        math: ['"Computer Modern"', 'serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- MathJax Configuration -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script type="text/javascript" id="MathJax-script" async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
    </script>

    <style>
        body {
            background-color: #0B0F19;
            color: #E2E8F0;
            overflow-x: hidden;
        }
        
        .glass-panel {
            background: rgba(26, 34, 53, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .formula-container svg {
            max-width: 100%;
            height: auto;
            display: inline-block;
        }

        /* Highlight transitions for formula parts */
        .math-highlight {
            transition: all 0.3s ease;
            fill: #60A5FA !important;
            text-shadow: 0 0 8px rgba(96, 165, 250, 0.8);
        }

        .step-indicator {
            transition: all 0.3s ease;
        }
        
        .step-indicator.active {
            background-color: #3B82F6;
            transform: scale(1.2);
            box-shadow: 0 0 10px #3B82F6;
        }

        #visualCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0B0F19;
        }
        ::-webkit-scrollbar-thumb {
            background: #3B82F6;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-bio-accent selection:text-white">

    <main class="flex-grow flex flex-col h-screen overflow-hidden">
        
        <!-- Header -->
        <header class="glass-panel p-4 z-10 shadow-lg shadow-black/50">
            <div class="max-w-7xl mx-auto flex justify-between items-center relative">
                <div>
                    <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">
                        Chern-Simons Action
                    </h1>
                    <p class="text-sm text-bio-muted">Biochain AI Explainer &bull; 3D Topological Gauge Theory</p>
                </div>
                <div class="hidden md:block">
                    <button id="restartBtn" class="px-4 py-2 rounded-full border border-bio-muted hover:border-bio-accent hover:text-bio-glow transition-colors text-sm">
                        Restart Tutorial
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <div class="flex-grow flex flex-col md:flex-row relative z-0">
            
            <!-- Left Panel: Text & Formula -->
            <section class="w-full md:w-1/2 p-6 lg:p-12 flex flex-col justify-center overflow-y-auto z-10 glass-panel md:border-r border-white/10 relative">
                
                <div class="absolute inset-0 bg-gradient-to-br from-blue-900/10 to-purple-900/10 pointer-events-none"></div>
                
                <div class="relative z-10 max-w-xl mx-auto w-full">
                    
                    <!-- Formula Display -->
                    <div class="mb-8 p-6 bg-bio-dark/50 rounded-2xl border border-white/5 shadow-inner">
                        <div class="text-xs text-bio-muted uppercase tracking-wider mb-2 font-semibold">The Core Formula</div>
                        <div id="mainFormula" class="text-xl md:text-2xl formula-container text-center text-white">
                            $$S(A)=\frac{k}{4\pi}\int_M \text{Tr}\left(A\wedge dA+\frac{2}{3}A\wedge A\wedge A\right)$$
                        </div>
                    </div>

                    <!-- Dynamic Text Content -->
                    <div id="contentArea" class="min-h-[250px]">
                        <h2 id="stepTitle" class="text-2xl md:text-3xl font-bold mb-4 text-bio-glow">Introduction</h2>
                        <div id="stepText" class="text-lg text-bio-text space-y-4 leading-relaxed">
                            Loading content...
                        </div>
                    </div>

                </div>
            </section>

            <!-- Right Panel: Interactive Canvas -->
            <section class="w-full md:w-1/2 relative bg-black/20 overflow-hidden h-64 md:h-auto">
                <div class="absolute top-4 left-4 z-10 bg-black/50 px-3 py-1 rounded-full text-xs text-bio-muted border border-white/10 backdrop-blur-md">
                    Interactive Visualization
                </div>
                <canvas id="visualCanvas"></canvas>
            </section>
        </div>

        <!-- Bottom Navigation -->
        <footer class="glass-panel p-4 z-10 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
            <div class="max-w-5xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
                
                <button id="prevBtn" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-bio-card hover:bg-bio-dark border border-white/10 text-white transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    Previous
                </button>

                <!-- Progress Indicators -->
                <div class="flex gap-2" id="progressDots">
                    <!-- Dots injected by JS -->
                </div>

                <button id="nextBtn" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 border border-blue-400/50 text-white font-semibold transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-[0_0_15px_rgba(37,99,235,0.4)] flex items-center justify-center gap-2">
                    Next Step
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
                
            </div>
        </footer>
    </main>

    <script>
        // --- Tutorial Content Data ---
        const tutorialSteps = [
            {
                id: 'intro',
                title: 'Overview',
                text: `<p>This formula appears in <strong>3-dimensional topological field theory</strong>.</p>
                       <p>The main focus here is not distance, angles, or curvature from a metric (like in General Relativity), but rather the <strong>global twisting and linking structure</strong> of fields.</p>`,
                mathHighlight: null, // No specific highlight initially
                animType: 'intro'
            },
            {
                id: 'manifold',
                title: '1. The Space: $M^3$',
                text: `<p>We begin with a 3-dimensional manifold $M^3$. Think of it as the "space" where the theory lives.</p>
                       <p>Because the theory is <strong>topological</strong>, it doesn't use a ruler. If you stretch, bend, or deform the space smoothly without tearing it, the important physics quantities remain unchanged.</p>`,
                mathHighlight: '\\int_M',
                animType: 'manifold'
            },
            {
                id: 'connection',
                title: '2. The Gauge Field: $A$',
                text: `<p>The symbol $A$ is a <strong>gauge connection 1-form</strong>: $A \\in \\Omega^1(M,\\mathfrak{g})$.</p>
                       <p>Conceptually, it is a field living on the manifold, acting like a generalized vector potential. It describes how internal gauge information changes as you move from point to point, visualized as flowing threads through the space.</p>`,
                mathHighlight: 'A',
                animType: 'vectorField'
            },
            {
                id: 'linear',
                title: '3. Linear Twisting: $A \\wedge dA$',
                text: `<p>The first part inside the integral is $A \\wedge dA$.</p>
                       <p>Here, $dA$ measures how $A$ changes locally, and the wedge product $\\wedge$ combines them. Visually, this measures how the field <strong>twists around itself locally</strong>, often represented by vortex-like motion or spiraling field lines.</p>`,
                mathHighlight: 'A\\wedge dA',
                animType: 'vortex'
            },
            {
                id: 'cubic',
                title: '4. Cubic Self-Interaction: $\\frac{2}{3}A \\wedge A \\wedge A$',
                text: `<p>This is the <strong>non-abelian self-interaction term</strong>.</p>
                       <p>Because the field values are matrices that don't commute ($AB \\neq BA$), the field can interact with itself. This is shown as three vector streams meeting at a point, representing this cubic self-coupling.</p>`,
                mathHighlight: '\\frac{2}{3}A\\wedge A\\wedge A',
                animType: 'cubic'
            },
            {
                id: 'trace_integral',
                title: '5 & 6. Trace & Integral',
                text: `<p>The <strong>Trace ($\\text{Tr}$)</strong> converts the matrix-valued field data into an ordinary scalar number (a gauge-invariant quantity).</p>
                       <p>The <strong>Integral ($\\int_M$)</strong> collects all this local twisting and interacting information from every point, summing it up to find the total topological twisting over the entire space $M^3$.</p>`,
                mathHighlight: '\\int_M \\text{Tr}',
                animType: 'integral'
            },
            {
                id: 'level',
                title: '7. The Level: $k$',
                text: `<p>The constant $k$ in front ($\\frac{k}{4\\pi}$) is usually a positive integer ($k \\in \\mathbb{Z}^+$).</p>
                       <p>It is called the <strong>level</strong> of the theory. It controls the strength or quantization level, ensuring the quantum theory is well-defined under large gauge transformations.</p>`,
                mathHighlight: '\\frac{k}{4\\pi}',
                animType: 'level'
            },
            {
                id: 'summary',
                title: 'Summary',
                text: `<p>Chern-Simons theory asks: How are these invisible threads twisting? How are they linking? How do they interact with themselves?</p>
                       <p>It creates a topological invariant, central to knot theory and quantum computing, all without needing to know the distances between points.</p>`,
                mathHighlight: null,
                animType: 'summary'
            }
        ];

        let currentStepIndex = 0;

        // DOM Elements
        const titleEl = document.getElementById('stepTitle');
        const textEl = document.getElementById('stepText');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const dotsContainer = document.getElementById('progressDots');
        const restartBtn = document.getElementById('restartBtn');

        // --- STREAMING_CHUNK:Setting up UI navigation and rendering logic ---
        
        function initUI() {
            // Create progress dots
            tutorialSteps.forEach((_, idx) => {
                const dot = document.createElement('div');
                dot.className = `w-2.5 h-2.5 rounded-full step-indicator bg-white/20 cursor-pointer`;
                dot.onclick = () => goToStep(idx);
                dotsContainer.appendChild(dot);
            });
            updateUI();
        }

        function updateUI() {
            const step = tutorialSteps[currentStepIndex];
            
            // Update Text
            titleEl.innerHTML = step.title;
            textEl.innerHTML = step.text;

            // Trigger MathJax render for new dynamic content
            if (window.MathJax) {
                MathJax.typesetPromise([titleEl, textEl]).catch((err) => console.log(err));
            }

            // Update Buttons
            prevBtn.disabled = currentStepIndex === 0;
            if (currentStepIndex === tutorialSteps.length - 1) {
                nextBtn.innerHTML = `Finish <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
                nextBtn.classList.replace('bg-blue-600', 'bg-green-600');
                nextBtn.classList.replace('hover:bg-blue-500', 'hover:bg-green-500');
                nextBtn.classList.replace('shadow-[0_0_15px_rgba(37,99,235,0.4)]', 'shadow-[0_0_15px_rgba(22,163,74,0.4)]');
            } else {
                nextBtn.innerHTML = `Next Step <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>`;
                nextBtn.classList.replace('bg-green-600', 'bg-blue-600');
                nextBtn.classList.replace('hover:bg-green-500', 'hover:bg-blue-500');
                nextBtn.classList.replace('shadow-[0_0_15px_rgba(22,163,74,0.4)]', 'shadow-[0_0_15px_rgba(37,99,235,0.4)]');
            }

            // Update Dots
            Array.from(dotsContainer.children).forEach((dot, idx) => {
                if (idx === currentStepIndex) {
                    dot.classList.add('active');
                    dot.classList.remove('bg-white/20');
                } else {
                    dot.classList.remove('active');
                    dot.classList.add('bg-white/20');
                }
            });

            // Signal animation engine to change state
            changeAnimationState(step.animType);
        }

        function goToStep(index) {
            if (index >= 0 && index < tutorialSteps.length) {
                currentStepIndex = index;
                updateUI();
            }
        }

        prevBtn.addEventListener('click', () => goToStep(currentStepIndex - 1));
        nextBtn.addEventListener('click', () => {
            if (currentStepIndex === tutorialSteps.length - 1) {
                goToStep(0); // Loop back or handle finish
            } else {
                goToStep(currentStepIndex + 1);
            }
        });
        restartBtn.addEventListener('click', () => goToStep(0));

        // --- STREAMING_CHUNK:Building the HTML5 Canvas Animation Engine ---

        const canvas = document.getElementById('visualCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let animationFrameId;
        let time = 0;
        let currentAnimType = 'intro';

        // Particle system for fields
        let particles = [];
        const numParticles = 100;

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            width = canvas.width;
            height = canvas.height;
            initParticles();
        }
        window.addEventListener('resize', resizeCanvas);

        function initParticles() {
            particles = [];
            for(let i=0; i<numParticles; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: 0, vy: 0,
                    life: Math.random() * 100,
                    color: Math.random() > 0.5 ? '#3B82F6' : '#8B5CF6' // Blue or Purple
                });
            }
        }

        function changeAnimationState(type) {
            currentAnimType = type;
            time = 0; // Reset time for transition effects
            if(type === 'vectorField' || type === 'vortex' || type === 'summary') {
                initParticles();
            }
        }

        // --- STREAMING_CHUNK:Defining rendering logic for specific steps ---

        function drawBlob(cx, cy, radius, numPoints, timeOff, color, strokeColor) {
            ctx.beginPath();
            for (let i = 0; i <= numPoints; i++) {
                const angle = (i / numPoints) * Math.PI * 2;
                // Add topological "wobble" that changes over time
                const wobble = Math.sin(angle * 3 + timeOff) * 15 + Math.cos(angle * 5 - timeOff * 1.5) * 10;
                const r = radius + wobble;
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            if (color) {
                ctx.fillStyle = color;
                ctx.fill();
            }
            if (strokeColor) {
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function renderIntro() {
            // Pulsing abstract shape
            const cx = width / 2;
            const cy = height / 2;
            const radius = Math.min(width, height) * 0.2;
            
            // Background glow
            const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 3);
            grad.addColorStop(0, 'rgba(59, 130, 246, 0.1)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0,0,width,height);

            drawBlob(cx, cy, radius, 100, time * 0.02, 'rgba(30, 58, 138, 0.3)', 'rgba(96, 165, 250, 0.8)');
            drawBlob(cx, cy, radius * 0.7, 80, -time * 0.03, 'rgba(88, 28, 135, 0.3)', 'rgba(192, 132, 252, 0.8)');
        }

        function renderManifold() {
            const cx = width / 2;
            const cy = height / 2;
            
            // Animate deformation dramatically
            const stretchX = Math.sin(time * 0.03) * 50;
            const stretchY = Math.cos(time * 0.02) * 30;
            
            ctx.save();
            ctx.translate(cx, cy);
            
            // Draw a knot-like object mapping 3D to 2D
            ctx.beginPath();
            for(let t=0; t<Math.PI*2; t+=0.05) {
                // Lissajous curve for knot illusion
                let x = Math.sin(3*t + time*0.01) * (100 + stretchX);
                let y = Math.sin(2*t) * (100 + stretchY);
                if(t===0) ctx.moveTo(x,y);
                else ctx.lineTo(x,y);
            }
            ctx.closePath();
            
            ctx.strokeStyle = 'rgba(96, 165, 250, 0.9)';
            ctx.lineWidth = 8;
            ctx.lineJoin = 'round';
            ctx.stroke();
            
            // Inner core
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.restore();

            // Overlay text
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.font = '16px Inter';
            ctx.textAlign = 'center';
            ctx.fillText("Smooth deformation...", width/2, height - 30);
        }

        // --- STREAMING_CHUNK:Rendering gauge fields and particle flows ---

        function renderVectorField() {
            // Draw a flowing field of particles
            ctx.fillStyle = 'rgba(11, 15, 25, 0.15)'; // Trail effect
            ctx.fillRect(0, 0, width, height);

            const cx = width / 2;
            const cy = height / 2;

            particles.forEach(p => {
                // Field logic: gentle flow to the right with sine wave vertical motion
                p.vx = 2 + Math.sin(p.y * 0.02 + time * 0.05);
                p.vy = Math.cos(p.x * 0.02 + time * 0.05);

                p.x += p.vx;
                p.y += p.vy;
                p.life -= 1;

                // Wrap around
                if(p.x > width) p.x = 0;
                if(p.x < 0) p.x = width;
                if(p.y > height) p.y = 0;
                if(p.y < 0) p.y = height;

                if(p.life <= 0) {
                    p.x = Math.random() * width;
                    p.y = Math.random() * height;
                    p.life = 50 + Math.random() * 100;
                }

                // Draw "thread"
                ctx.beginPath();
                ctx.moveTo(p.x - p.vx*2, p.y - p.vy*2);
                ctx.lineTo(p.x, p.y);
                ctx.strokeStyle = p.color;
                ctx.lineWidth = 2;
                ctx.stroke();
            });
            
            // Symbol
            ctx.fillStyle = '#60A5FA';
            ctx.font = 'italic bold 40px "Computer Modern", serif';
            ctx.textAlign = 'center';
            ctx.fillText("A", cx, cy);
        }

        function renderVortex() {
            ctx.fillStyle = 'rgba(11, 15, 25, 0.2)';
            ctx.fillRect(0, 0, width, height);

            const cx = width / 2;
            const cy = height / 2;

            particles.forEach(p => {
                // Curl/Vortex field logic (A wedge dA)
                const dx = p.x - cx;
                const dy = p.y - cy;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                // Rotational velocity
                p.vx = -dy * 0.05;
                p.vy = dx * 0.05;
                
                // Pull towards center slightly
                p.vx -= dx * 0.01;
                p.vy -= dy * 0.01;

                p.x += p.vx;
                p.y += p.vy;

                // Reset if too close or too far
                if (dist < 10 || dist > 300) {
                    const angle = Math.random() * Math.PI * 2;
                    const r = 250;
                    p.x = cx + Math.cos(angle) * r;
                    p.y = cy + Math.sin(angle) * r;
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, 1.5, 0, Math.PI*2);
                ctx.fillStyle = p.color;
                ctx.fill();
            });

            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.font = 'italic 30px "Computer Modern", serif';
            ctx.textAlign = 'center';
            ctx.fillText("A ∧ dA", cx, cy + 80);
        }

        // --- STREAMING_CHUNK:Rendering cubic interactions and final concepts ---

        function renderCubic() {
            ctx.clearRect(0, 0, width, height);
            const cx = width / 2;
            const cy = height / 2;

            // Draw three interacting paths meeting at center
            const pulse = Math.sin(time * 0.05) * 10;
            const angles = [time*0.02, time*0.02 + (Math.PI*2/3), time*0.02 + (Math.PI*4/3)];
            const colors = ['#3B82F6', '#8B5CF6', '#EC4899']; // Blue, Purple, Pink

            angles.forEach((angle, i) => {
                const startX = cx + Math.cos(angle) * 200;
                const startY = cy + Math.sin(angle) * 200;
                
                // Draw path
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                // Bezier curve to center
                ctx.quadraticCurveTo(
                    cx + Math.cos(angle - 0.5) * 100, 
                    cy + Math.sin(angle - 0.5) * 100, 
                    cx, cy
                );
                ctx.strokeStyle = colors[i];
                ctx.lineWidth = 4 + Math.sin(time*0.1 + i)*2;
                // Dash effect for flow
                ctx.setLineDash([10, 10]);
                ctx.lineDashOffset = -time * 2;
                ctx.stroke();
                ctx.setLineDash([]); // reset

                // Draw source point
                ctx.beginPath();
                ctx.arc(startX, startY, 8, 0, Math.PI*2);
                ctx.fillStyle = colors[i];
                ctx.fill();
            });

            // Interaction node in center
            ctx.beginPath();
            ctx.arc(cx, cy, 15 + pulse, 0, Math.PI*2);
            ctx.fillStyle = '#FBBF24'; // Amber/Gold glow for interaction
            ctx.shadowColor = '#FBBF24';
            ctx.shadowBlur = 20;
            ctx.fill();
            ctx.shadowBlur = 0; // reset

            ctx.fillStyle = 'white';
            ctx.font = 'italic 24px "Computer Modern", serif';
            ctx.textAlign = 'center';
            ctx.fillText("A ∧ A ∧ A", cx, cy + 50);
        }

        function renderIntegral() {
            ctx.clearRect(0, 0, width, height);
            const cx = width / 2;
            const cy = height / 2;

            // Draw background manifold outline faintly
            drawBlob(cx, cy, 120, 50, 0, 'rgba(255,255,255,0.02)', 'rgba(255,255,255,0.1)');

            // Show localized points accumulating
            for(let i=0; i<30; i++) {
                const angle = i * 0.5 + time*0.01;
                const r = (i * 5) % 100 + 20;
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r;

                // Points pulse and move slightly
                const s = (Math.sin(time*0.1 + i) + 1) * 3;
                
                ctx.beginPath();
                ctx.arc(x, y, s, 0, Math.PI*2);
                ctx.fillStyle = `hsla(${200 + i*2}, 80%, 60%, ${0.3 + s/6})`;
                ctx.fill();
            }

            // Scanning effect representing integration
            const scanY = cy - 150 + ((time * 2) % 300);
            ctx.beginPath();
            ctx.moveTo(cx - 150, scanY);
            ctx.lineTo(cx + 150, scanY);
            ctx.strokeStyle = 'rgba(96, 165, 250, 0.5)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Symbol
            ctx.fillStyle = '#fff';
            ctx.font = 'italic 40px "Computer Modern", serif';
            ctx.textAlign = 'center';
            ctx.fillText("∫", cx - 40, cy + 15);
            ctx.font = '20px "Computer Modern", serif';
            ctx.fillText("Tr(...)", cx + 20, cy + 10);
        }

        function renderLevel() {
            ctx.clearRect(0, 0, width, height);
            const cx = width / 2;
            const cy = height / 2;
            
            // Discreteness visualization
            const k = Math.floor((time / 30) % 5) + 1; // cycles 1 through 5
            
            // Draw rings based on k
            for(let i=1; i<=k; i++) {
                ctx.beginPath();
                ctx.arc(cx, cy, i * 25, 0, Math.PI*2);
                ctx.strokeStyle = `rgba(59, 130, 246, ${1 - i*0.15})`;
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            ctx.fillStyle = '#60A5FA';
            ctx.font = 'bold 60px "Computer Modern", serif';
            ctx.textAlign = 'center';
            ctx.fillText(`k = ${k}`, cx, cy + 20);
            
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.font = '14px Inter';
            ctx.fillText("Quantized levels (integers)", cx, cy + 80);
        }

        function renderSummary() {
            // Combine elements
            ctx.fillStyle = 'rgba(11, 15, 25, 0.1)';
            ctx.fillRect(0, 0, width, height);

            const cx = width / 2;
            const cy = height / 2;

            // Background blob
            drawBlob(cx, cy, 100, 60, time*0.01, null, 'rgba(59, 130, 246, 0.2)');

            // Field particles swirling in a figure 8 (linking)
            particles.forEach(p => {
                const t = p.life * 0.05 + time*0.02;
                // Lissajous figure 8
                const targetX = cx + Math.sin(t) * 120;
                const targetY = cy + Math.sin(t*2) * 60;
                
                p.x += (targetX - p.x) * 0.05;
                p.y += (targetY - p.y) * 0.05;

                ctx.beginPath();
                ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
                ctx.fillStyle = p.color;
                ctx.fill();
            });
            
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 24px Inter';
            ctx.textAlign = 'center';
            ctx.fillText("Topological Invariant", cx, height - 40);
        }

        // --- STREAMING_CHUNK:Main animation loop and final setup ---

        function animate() {
            time++;
            
            switch(currentAnimType) {
                case 'intro': renderIntro(); break;
                case 'manifold': renderManifold(); break;
                case 'vectorField': renderVectorField(); break;
                case 'vortex': renderVortex(); break;
                case 'cubic': renderCubic(); break;
                case 'integral': renderIntegral(); break;
                case 'level': renderLevel(); break;
                case 'summary': renderSummary(); break;
                default: ctx.clearRect(0, 0, width, height);
            }

            animationFrameId = requestAnimationFrame(animate);
        }

        // Initial setup
        window.onload = () => {
            resizeCanvas();
            initUI();
            
            // Wait slightly for MathJax to load before doing initial typeset trickery
            setTimeout(() => {
                animate();
            }, 500);
        };
    </script>
</body>
