<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enochian // Holy Table Projector</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: black; color: #4ade80; font-family: 'Courier New', Courier, monospace; }
        .crt-grid {
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
        .cell-active {
            background-color: rgba(255, 255, 255, 0.8) !important;
            box-shadow: 0 0 15px #ffffff;
            color: black !important;
            z-index: 50;
        }
        .row-highlight {
            background-color: rgba(34, 211, 238, 0.2) !important; /* Cyan Highlight */
            border-color: rgba(34, 211, 238, 0.5) !important;
        }
        .corner-node {
            background-color: #f59e0b !important; /* Amber corners */
            color: black !important;
            font-weight: bold;
        }
        .arc-path {
            fill: none;
            stroke-linecap: round;
            vector-effect: non-scaling-stroke;
            transition: all 0.3s ease;
        }
        .strip-node {
            cursor: pointer;
            transition: all 0.2s;
        }
        .strip-node:hover {
            background-color: rgba(255,255,255,0.2) !important;
            color: white !important;
        }
        .strip-node-selected {
            background-color: #22d3ee !important; /* Cyan Select */
            color: black !important;
            font-weight: bold;
            box-shadow: 0 0 10px #22d3ee;
        }
        .strip-node-synced {
            background-color: rgba(74, 222, 128, 0.4) !important;
            color: white !important;
            box-shadow: 0 0 5px #4ade80;
        }
        /* Zoom Container */
        .zoom-container {
            cursor: grab;
            touch-action: none;
        }
        .zoom-container:active {
            cursor: grabbing;
        }
        /* Scrollbar for sidebar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #15803d; }
    </style>
</head>
<body class="flex flex-col h-screen">
    <div class="flex-shrink-0 bg-black border-b border-green-800 text-[10px] text-green-500 px-3 py-1.5 flex justify-between items-center">
        <a href="index.html" class="hover:text-white transition-colors">&larr; MIND'S EYE INTERFACE</a>
        <span class="opacity-40 tracking-widest">NESTED HARMONIC COCOON</span>
    </div>
    <div id="root" class="flex-1 min-h-0"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- Icons ---
        const IconWrapper = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Icons = {
            Play: (props) => <IconWrapper {...props}><polygon points="5 3 19 12 5 21 5 3"/></IconWrapper>,
            Pause: (props) => <IconWrapper {...props}><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></IconWrapper>,
            Grid: (props) => <IconWrapper {...props}><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></IconWrapper>,
            Eye: (props) => <IconWrapper {...props}><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></IconWrapper>,
            Hexagon: (props) => <IconWrapper {...props}><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></IconWrapper>,
            Target: (props) => <IconWrapper {...props}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></IconWrapper>,
            ZoomIn: (props) => <IconWrapper {...props}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></IconWrapper>,
            Next: (props) => <IconWrapper {...props}><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></IconWrapper>,
            Prev: (props) => <IconWrapper {...props}><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></IconWrapper>,
            Sliders: (props) => <IconWrapper {...props}><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></IconWrapper>,
            Activity: (props) => <IconWrapper {...props}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></IconWrapper>,
            Zap: (props) => <IconWrapper {...props}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></IconWrapper>
        };

        // --- Logic: The 23x23 Ridged Field ---
        const GRID_SIZE = 23;
        const CENTER_IDX = 11; 

        const getTableValue = (x, y) => {
            const distCenterX = Math.abs(CENTER_IDX - x);
            const distCenterY = Math.abs(CENTER_IDX - y);
            const valX = 12 - distCenterX;
            const valY = 12 - distCenterY;
            return Math.max(valX, valY);
        };

        // --- Visual Components ---

        const Starfield = () => {
            const canvasRef = useRef(null);
            useEffect(() => {
                const cvs = canvasRef.current;
                const ctx = cvs.getContext('2d');
                const resize = () => { cvs.width = window.innerWidth; cvs.height = window.innerHeight; };
                window.addEventListener('resize', resize);
                resize();
                
                const stars = Array.from({length: 100}, () => ({
                    x: Math.random() * cvs.width, y: Math.random() * cvs.height,
                    s: Math.random() * 2
                }));

                const draw = () => {
                    ctx.fillStyle = '#000';
                    ctx.fillRect(0,0,cvs.width, cvs.height);
                    ctx.fillStyle = '#14532d';
                    stars.forEach(st => {
                        ctx.fillRect(st.x, st.y, st.s, st.s);
                    });
                };
                draw();
            }, []);
            return <canvas ref={canvasRef} className="fixed inset-0 z-0 opacity-50" />;
        };

        // --- The Wave Arc Diagram ---
        const ArcDiagram = ({ orientation = "top", waveConfig, selectedNode, onSelectNode, pulseVal, syncWaves }) => {
            const { groups, amplitude, opacity } = waveConfig;
            
            const isVertical = orientation === "left" || orientation === "right";
            const thickness = 200; 
            const length = 600;
            
            const flexDirection = orientation === "top" ? "flex-col-reverse" : 
                                  orientation === "bottom" ? "flex-col" :
                                  orientation === "left" ? "flex-row-reverse" : "flex-row";

            // Render Arcs
            const renderArcs = () => {
                // Determine source nodes for arcs
                const sourceIndices = new Set();

                // 1. Manual Selection
                if (selectedNode && selectedNode.side === orientation) {
                    sourceIndices.add(selectedNode.index);
                }

                // 2. Auto Sync (Pulse)
                if (syncWaves && pulseVal !== null) {
                    // Find all indices on this strip that match the current pulse value
                    for (let i = 0; i < 23; i++) {
                        const val = 12 - Math.abs(11 - i);
                        if (val === pulseVal) {
                            sourceIndices.add(i);
                        }
                    }
                }

                // Default (Corners) if nothing else active? 
                // Usually noise, better to show nothing if no selection/sync to keep clean.
                if (sourceIndices.size === 0 && !selectedNode && !syncWaves) {
                    sourceIndices.add(0); sourceIndices.add(22);
                }

                return groups.flatMap(group => {
                    if (!group.visible) return [];
                    
                    return Array.from(sourceIndices).flatMap(startIdx => {
                        const directions = [1, -1];
                        return directions.flatMap(dir => 
                            group.range.map((dist, i) => {
                                const p1 = startIdx;
                                const p2 = startIdx + (dist * dir);
                                if (p2 < 0 || p2 > 22) return null; 

                                const span = Math.abs(p2 - p1);
                                const slotSize = 100 / 23; 
                                const c1 = (p1 + 0.5) * slotSize;
                                const c2 = (p2 + 0.5) * slotSize;
                                
                                const px1 = (p1 + 0.5) * (length/23);
                                const px2 = (p2 + 0.5) * (length/23);
                                
                                const arcH = span * 10 * amplitude; 

                                let d = "";
                                if (isVertical) {
                                    const base = orientation === "left" ? 200 : 0;
                                    const ctrl = orientation === "left" ? 200 - arcH : arcH;
                                    d = `M ${base},${px1} Q ${ctrl},${(px1+px2)/2} ${base},${px2}`;
                                } else {
                                    const base = orientation === "top" ? 200 : 0;
                                    const ctrl = orientation === "top" ? 200 - arcH : arcH;
                                    d = `M ${px1},${base} Q ${(px1+px2)/2},${ctrl} ${px2},${base}`;
                                }

                                // Styling
                                const isManual = selectedNode && selectedNode.side === orientation && selectedNode.index === startIdx;
                                const isSynced = syncWaves && (12 - Math.abs(11 - startIdx) === pulseVal);
                                
                                const isHighlight = isManual || isSynced;
                                const arcOpacity = isHighlight ? 0.9 : (opacity * 0.3);
                                const arcWidth = isHighlight ? 2 : 0.8;

                                return (
                                    <path 
                                        key={`arc-${orientation}-${p1}-${p2}-${dir}`}
                                        d={d}
                                        stroke={group.color}
                                        strokeWidth={arcWidth}
                                        fill="none"
                                        opacity={arcOpacity}
                                        className="arc-path"
                                    />
                                );
                            })
                        );
                    });
                });
            };

            return (
                <div 
                    className={`flex ${flexDirection} pointer-events-auto`} 
                    style={{ 
                        width: isVertical ? thickness + 40 : length, 
                        height: isVertical ? length : thickness + 40 
                    }}
                >
                    <div style={{ width: isVertical ? thickness : length, height: isVertical ? length : thickness }}>
                        <svg width="100%" height="100%" viewBox={`0 0 ${isVertical ? thickness : length} ${isVertical ? length : thickness}`} className="overflow-visible">
                            {renderArcs()}
                        </svg>
                    </div>

                    <div style={{ width: isVertical ? 15 : '100%', height: isVertical ? '100%' : 15 }}></div>

                    <div className={`flex ${isVertical ? 'flex-col w-6 h-full' : 'w-full h-6 flex-row'} bg-black z-20`}>
                        {Array.from({length: 23}, (_, i) => {
                            const val = 12 - Math.abs(11 - i);
                            const isGreen = i <= 11;
                            const isSelected = selectedNode && selectedNode.side === orientation && selectedNode.index === i;
                            const isSynced = syncWaves && (val === pulseVal);
                            
                            return (
                                <div 
                                    key={i} 
                                    onClick={() => onSelectNode({ side: orientation, index: i })}
                                    className={`
                                        flex-1 flex items-center justify-center text-[8px] font-mono border-[0.5px] border-green-900/30
                                        strip-node
                                        ${isSelected ? 'strip-node-selected' : ''}
                                        ${isSynced ? 'strip-node-synced' : ''}
                                        ${(!isSelected && !isSynced) ? (val === 12 ? 'bg-white/10 text-white font-bold' : isGreen ? 'text-green-600' : 'text-red-600') : ''}
                                    `}
                                >
                                    {val}
                                </div>
                            )
                        })}
                    </div>
                </div>
            );
        };

        // --- Control Panel Component ---
        const WaveControls = ({ config, setConfig, onClose }) => {
            const toggleGroup = (idx) => {
                const newGroups = [...config.groups];
                newGroups[idx].visible = !newGroups[idx].visible;
                setConfig({ ...config, groups: newGroups });
            };

            return (
                <div className="absolute top-16 right-4 w-64 bg-black/90 border border-green-500 p-4 rounded shadow-2xl z-50 text-green-400 backdrop-blur-md">
                    <div className="flex justify-between items-center mb-4 border-b border-green-800 pb-2">
                        <h3 className="text-xs font-bold flex items-center gap-2"><Icons.Activity size={14}/> WAVE FUNCTIONS</h3>
                        <button onClick={onClose} className="text-green-700 hover:text-white">x</button>
                    </div>
                    
                    <div className="space-y-4">
                        <div className="space-y-1">
                            <label className="text-[10px] font-bold opacity-70">HARMONIC GROUPS</label>
                            {config.groups.map((g, i) => (
                                <button 
                                    key={g.name}
                                    onClick={() => toggleGroup(i)}
                                    className={`w-full flex justify-between items-center px-2 py-1 text-[10px] border ${g.visible ? 'border-green-500 bg-green-900/30' : 'border-gray-800 text-gray-500'}`}
                                >
                                    <span style={{ color: g.visible ? g.color : 'inherit' }}>{g.name} ({g.desc})</span>
                                    <span>{g.visible ? "ON" : "OFF"}</span>
                                </button>
                            ))}
                        </div>

                        <div className="space-y-1">
                            <label className="text-[10px] font-bold opacity-70">AMPLITUDE SCALE</label>
                            <input 
                                type="range" min="0.1" max="2.0" step="0.1" 
                                value={config.amplitude} 
                                onChange={(e) => setConfig({...config, amplitude: parseFloat(e.target.value)})}
                                className="w-full accent-green-500 h-1 bg-gray-800 appearance-none rounded"
                            />
                        </div>
                        
                        <div className="space-y-1">
                            <label className="text-[10px] font-bold opacity-70">OPACITY</label>
                            <input 
                                type="range" min="0.1" max="1.0" step="0.1" 
                                value={config.opacity} 
                                onChange={(e) => setConfig({...config, opacity: parseFloat(e.target.value)})}
                                className="w-full accent-green-500 h-1 bg-gray-800 appearance-none rounded"
                            />
                        </div>
                    </div>
                </div>
            );
        };

        function EnochianTable() {
            const [pulseTime, setPulseTime] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [showSigils, setShowSigils] = useState(true);
            const [showValues, setShowValues] = useState(true);
            const [showWaveCtrl, setShowWaveCtrl] = useState(false);
            const [selectedNode, setSelectedNode] = useState(null); 
            const [syncWaves, setSyncWaves] = useState(false);
            
            // Wave Configuration State
            const [waveConfig, setWaveConfig] = useState({
                amplitude: 1.0,
                opacity: 0.6,
                groups: [
                    { name: "G1", desc: "N3-5", range: [2, 3, 4], color: "#22d3ee", visible: true },
                    { name: "G2", desc: "N6-8", range: [5, 6, 7], color: "#4ade80", visible: true },
                    { name: "G3", desc: "N9-11", range: [8, 9, 10], color: "#fbbf24", visible: true },
                    { name: "M", desc: "N12", range: [11], color: "#a855f7", visible: true }
                ]
            });
            
            // Zoom & Pan State
            const [zoom, setZoom] = useState(0.7);
            const [pan, setPan] = useState({ x: 0, y: 0 });
            const [isDragging, setIsDragging] = useState(false);
            const [lastPos, setLastPos] = useState({ x: 0, y: 0 });
            
            const reqRef = useRef();
            const containerRef = useRef();

            useEffect(() => {
                if (isPlaying) {
                    const animate = () => {
                        setPulseTime(p => (p + 0.15) % 13); 
                        reqRef.current = requestAnimationFrame(animate);
                    };
                    reqRef.current = requestAnimationFrame(animate);
                }
                return () => cancelAnimationFrame(reqRef.current);
            }, [isPlaying]);

            const handleStep = (direction) => {
                setIsPlaying(false);
                setPulseTime(prev => {
                    let next = prev + direction;
                    if (next < 0) next = 12;
                    if (next >= 13) next = 0;
                    return next;
                });
            };

            const handleWheel = (e) => {
                e.preventDefault();
                const scaleAmount = -e.deltaY * 0.001;
                const newZoom = Math.min(Math.max(0.2, zoom + scaleAmount), 4);
                setZoom(newZoom);
            };

            const handleMouseDown = (e) => {
                if(e.target.closest('.strip-node')) return;
                setIsDragging(true);
                setLastPos({ x: e.clientX, y: e.clientY });
            };

            const handleMouseMove = (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - lastPos.x;
                const deltaY = e.clientY - lastPos.y;
                setPan(p => ({ x: p.x + deltaX, y: p.y + deltaY }));
                setLastPos({ x: e.clientX, y: e.clientY });
            };

            const handleMouseUp = () => {
                setIsDragging(false);
            };
            
            const handleSelectNode = (node) => {
                if (selectedNode && selectedNode.side === node.side && selectedNode.index === node.index) {
                    setSelectedNode(null);
                } else {
                    setSelectedNode(node);
                }
            };

            const grid = useMemo(() => {
                const g = [];
                for (let y = 0; y < GRID_SIZE; y++) {
                    const row = [];
                    for (let x = 0; x < GRID_SIZE; x++) {
                        const val = getTableValue(x, y);
                        row.push({ x, y, val });
                    }
                    g.push(row);
                }
                return g;
            }, []);

            // Pulse Value Calculation
            const currentPulseVal = 12 - Math.floor(pulseTime);

            return (
                <div className="flex flex-col h-full bg-black text-green-400 font-mono relative overflow-hidden">
                    <Starfield />
                    <div className="absolute inset-0 crt-grid z-10 pointer-events-none"></div>

                    {/* Header */}
                    <header className="relative z-30 p-4 border-b border-green-900 bg-black/80 flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <div className="p-2 border border-green-500 bg-green-900/20">
                                <Icons.Grid size={24} />
                            </div>
                            <div>
                                <h1 className="text-xl font-bold tracking-tighter">ENOCHIAN_TABLET.EXE</h1>
                                <p className="text-[10px] tracking-widest text-green-600">23x23 UNIFIED FIELD // INTERACTIVE</p>
                            </div>
                        </div>
                        <div className="flex gap-4 items-center">
                            <div className="flex items-center gap-2 mr-4 px-3 py-1 border border-green-900 bg-black/50 rounded text-xs">
                                <Icons.ZoomIn size={14} />
                                <span>{(zoom * 100).toFixed(0)}%</span>
                            </div>
                            
                            <button onClick={() => setSyncWaves(!syncWaves)} className={`flex items-center gap-2 px-3 py-1 border text-xs font-bold transition-all ${syncWaves ? 'bg-green-500 text-black border-green-400' : 'border-green-900 text-green-600'}`}>
                                <Icons.Zap size={14} />
                                {syncWaves ? "SYNC ON" : "SYNC OFF"}
                            </button>

                            <button onClick={() => setShowWaveCtrl(!showWaveCtrl)} className={`border p-2 hover:bg-green-900/50 ${showWaveCtrl ? 'bg-green-900/30 border-green-400 text-white' : 'border-green-900'}`} title="Wave Settings">
                                <Icons.Sliders size={18} />
                            </button>

                            <div className="h-6 w-px bg-green-900 mx-2"></div>
                            <button onClick={() => setShowSigils(!showSigils)} className={`border p-2 hover:bg-green-900/50 ${showSigils ? 'bg-green-900/30 border-green-400' : 'border-green-900'}`}>
                                <Icons.Hexagon size={18} />
                            </button>
                            <button onClick={() => setShowValues(!showValues)} className={`border p-2 hover:bg-green-900/50 ${showValues ? 'bg-green-900/30 border-green-400' : 'border-green-900'}`}>
                                <Icons.Eye size={18} />
                            </button>
                            
                            <div className="flex gap-1">
                                <button onClick={() => handleStep(-1)} className="border border-green-800 p-2 hover:bg-green-900 text-green-500">
                                    <Icons.Prev size={18}/>
                                </button>
                                <button onClick={() => setIsPlaying(!isPlaying)} className="border border-green-500 p-2 hover:bg-green-500 hover:text-black transition-colors">
                                    {isPlaying ? <Icons.Pause size={18}/> : <Icons.Play size={18}/>}
                                </button>
                                <button onClick={() => handleStep(1)} className="border border-green-800 p-2 hover:bg-green-900 text-green-500">
                                    <Icons.Next size={18}/>
                                </button>
                            </div>
                            <button onClick={() => { setPan({x:0,y:0}); setZoom(0.7); setSelectedNode(null); }} className="border border-green-800 p-2 hover:bg-green-900/50 text-green-600 ml-2" title="Reset View">
                                <Icons.Target size={18} />
                            </button>
                        </div>
                    </header>

                    {showWaveCtrl && (
                        <WaveControls config={waveConfig} setConfig={setWaveConfig} onClose={() => setShowWaveCtrl(false)} />
                    )}

                    {/* Infinite Canvas */}
                    <main 
                        ref={containerRef}
                        className="relative z-20 flex-1 overflow-hidden zoom-container bg-black/20"
                        onWheel={handleWheel}
                        onMouseDown={handleMouseDown}
                        onMouseMove={handleMouseMove}
                        onMouseUp={handleMouseUp}
                        onMouseLeave={handleMouseUp}
                    >
                        <div 
                            className="absolute top-1/2 left-1/2 flex flex-col items-center justify-center origin-center transition-transform duration-75"
                            style={{ 
                                transform: `translate(-50%, -50%) translate(${pan.x}px, ${pan.y}px) scale(${zoom})`,
                                width: '2000px', 
                                height: '2000px' 
                            }}
                        >
                            
                            {/* Top Wave Diagrams */}
                            <div className="flex flex-col items-center"> 
                                <ArcDiagram 
                                    orientation="top" 
                                    waveConfig={waveConfig} 
                                    selectedNode={selectedNode} 
                                    onSelectNode={handleSelectNode}
                                    pulseVal={currentPulseVal}
                                    syncWaves={syncWaves}
                                /> 
                            </div>

                            <div className="flex items-center justify-center">
                                {/* Left Wave Diagram */}
                                <div className="flex flex-row items-center">
                                    <ArcDiagram 
                                        orientation="left" 
                                        waveConfig={waveConfig}
                                        selectedNode={selectedNode} 
                                        onSelectNode={handleSelectNode}
                                        pulseVal={currentPulseVal}
                                        syncWaves={syncWaves}
                                    />
                                </div>

                                {/* Center Grid */}
                                <div className="relative aspect-square h-[600px] w-[600px] border border-green-800 bg-black shadow-2xl z-20">
                                    <div 
                                        className="grid w-full h-full gap-[1px] relative z-10" 
                                        style={{ 
                                            gridTemplateColumns: `repeat(${GRID_SIZE}, 1fr)`,
                                            gridTemplateRows: `repeat(${GRID_SIZE}, 1fr)`
                                        }}
                                    >
                                        {grid.map((row, y) => row.map((cell, x) => {
                                            const isPulse = Math.abs(cell.val - currentPulseVal) < 0.5;
                                            const isRidge = cell.val === 12;
                                            const isCorner = (x === 0 || x === 22) && (y === 0 || y === 22);
                                            
                                            let isSelected = false;
                                            if (selectedNode) {
                                                if (selectedNode.side === "top" || selectedNode.side === "bottom") {
                                                    isSelected = (x === selectedNode.index);
                                                } else if (selectedNode.side === "left" || selectedNode.side === "right") {
                                                    isSelected = (y === selectedNode.index);
                                                }
                                            }

                                            let cellColor = "rgba(20, 83, 45,"; 
                                            let borderColor = "border-green-900/20";
                                            let textColor = "text-green-400";

                                            if (x !== 11 && y !== 11) {
                                                if ((x > 11 && y < 11) || (x < 11 && y > 11)) {
                                                    cellColor = "rgba(127, 29, 29,"; 
                                                    borderColor = "border-red-900/20";
                                                    textColor = "text-red-400";
                                                }
                                            }

                                            const alpha = 0.1 + (cell.val / 12) * 0.6;

                                            return (
                                                <div 
                                                    key={`${x}-${y}`}
                                                    className={`
                                                        relative flex items-center justify-center text-[8px] border ${borderColor} ${textColor}
                                                        ${isPulse ? 'cell-active' : ''}
                                                        ${isSelected ? 'row-highlight' : ''}
                                                        ${isRidge ? 'bg-white/20 text-white font-bold border-white/30' : ''}
                                                        ${isCorner ? 'corner-node' : ''}
                                                    `}
                                                    style={{ backgroundColor: isPulse ? '' : (isRidge || isCorner || isSelected ? '' : `${cellColor} ${alpha})`) }}
                                                >
                                                    {showValues && (
                                                        <span className={isRidge ? "opacity-100" : "opacity-70"}>
                                                            {cell.val}
                                                        </span>
                                                    )}
                                                </div>
                                            );
                                        }))}
                                    </div>

                                    {showSigils && (
                                        <svg className="absolute inset-0 w-full h-full pointer-events-none z-30 p-1" viewBox="0 0 23 23" preserveAspectRatio="none">
                                            <defs>
                                                <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2" markerHeight="2">
                                                    <circle cx="5" cy="5" r="5" fill="#4ade80" />
                                                </marker>
                                            </defs>

                                            <line x1="11.5" y1="0" x2="11.5" y2="23" stroke="#ffffff" strokeWidth="0.1" strokeOpacity="0.4" />
                                            <line x1="0" y1="11.5" x2="23" y2="11.5" stroke="#ffffff" strokeWidth="0.1" strokeOpacity="0.4" />

                                            <polygon points="11.5,0.5 0.5,19.5 22.5,19.5" fill="none" stroke="#4ade80" strokeWidth="0.15" strokeOpacity="0.8" />
                                            <polygon points="11.5,22.5 0.5,3.5 22.5,3.5" fill="none" stroke="#ef4444" strokeWidth="0.15" strokeOpacity="0.8" />
                                            
                                            <circle cx="11.5" cy="11.5" r="3" fill="none" stroke="#ffffff" strokeWidth="0.1" opacity="0.5" />
                                            
                                            <circle cx="22.5" cy="3.5" r="0.3" fill="#ef4444" /> 
                                            <circle cx="0.5" cy="19.5" r="0.3" fill="#ef4444" /> 
                                            <circle cx="0.5" cy="3.5" r="0.3" fill="#4ade80" /> 
                                            <circle cx="22.5" cy="19.5" r="0.3" fill="#4ade80" /> 

                                            <line x1="0.5" y1="0.5" x2="22.5" y2="22.5" stroke="#fbbf24" strokeWidth="0.05" strokeDasharray="0.5" opacity="0.5" />
                                            <line x1="22.5" y1="0.5" x2="0.5" y2="22.5" stroke="#fbbf24" strokeWidth="0.05" strokeDasharray="0.5" opacity="0.5" />
                                        </svg>
                                    )}
                                </div>

                                {/* Right Wave Diagram */}
                                <div className="flex flex-row items-center">
                                    <ArcDiagram 
                                        orientation="right" 
                                        waveConfig={waveConfig}
                                        selectedNode={selectedNode} 
                                        onSelectNode={handleSelectNode}
                                        pulseVal={currentPulseVal}
                                        syncWaves={syncWaves}
                                    />
                                </div>
                            </div>

                            {/* Bottom Wave Diagram */}
                            <div className="flex flex-col items-center">
                                <ArcDiagram 
                                    orientation="bottom" 
                                    waveConfig={waveConfig}
                                    selectedNode={selectedNode} 
                                    onSelectNode={handleSelectNode}
                                    pulseVal={currentPulseVal}
                                    syncWaves={syncWaves}
                                />
                            </div>

                        </div>
                    </main>

                    <footer className="relative z-30 p-2 border-t border-green-900 bg-black/90 text-[10px] flex justify-between font-mono text-green-600">
                        <div className="flex gap-4">
                            <span>SELECTION: {selectedNode ? `${selectedNode.side.toUpperCase()} [${selectedNode.index}]` : "NONE"}</span>
                            <span>HARMONICS: 3x3 GROUPS</span>
                            <span>SINGULARITY: 12</span>
                        </div>
                        <div className="flex gap-2">
                            <span className="text-cyan-400" style={{ opacity: waveConfig.groups[0].visible ? 1 : 0.3 }}>GRP1 (N3-5)</span>
                            <span className="text-green-400" style={{ opacity: waveConfig.groups[1].visible ? 1 : 0.3 }}>GRP2 (N6-8)</span>
                            <span className="text-yellow-400" style={{ opacity: waveConfig.groups[2].visible ? 1 : 0.3 }}>GRP3 (N9-11)</span>
                            <span className="text-purple-400" style={{ opacity: waveConfig.groups[3].visible ? 1 : 0.3 }}>MASTER (N12)</span>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EnochianTable />);
    </script>
</body>
</html>
