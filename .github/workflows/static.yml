# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      skip_checks:
        description: "Emergency only: deploy without check-cores and the orbital-core test (record the skip in the decision log)"
        type: boolean
        default: false

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The shared cores as recorded in scripts/cores.json, and orbital_core.js's own test (under a minute). Skipped only
      # by the workflow_dispatch input skip_checks, in an emergency; the skip is written to the run's summary below.
      - name: Core manifest and the orbital core
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_checks) }}
        run: |
          node scripts/check-cores.mjs
          node scripts/geometric-build/tests/orbital-core.cjs
      - name: Record a skipped check
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_checks }}
        env:
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          echo "::warning::Deployed without check-cores and the orbital-core test (workflow_dispatch input skip_checks). Record this skip in the decision log."
          echo "Deployed without check-cores and the orbital-core test (skip_checks, run by $ACTOR at $SHA). Record this skip in the decision log." >> "$GITHUB_STEP_SUMMARY"
      # Adds the site bar (Home, Simulations and Manuals menus, sign-in, social links) to the pages in scripts/page-chrome-targets.json,
      # so a calculator export pushed without it still deploys with it.
      - name: Add site chrome to listed pages
        run: node scripts/install-page-chrome.mjs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
