# Refreshes the Research hub "Stay Current" snapshot (Pages/Research/data/feed*.json),
# syncs your articles (articles-feed.json)
# and redeploys the site. Runs daily and can be started manually from the Actions tab.
name: Update research feed

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  # Also run as soon as the sync code itself changes on main.
  push:
    branches: ["main"]
    paths:
      - "scripts/update-research-feed.mjs"
      - "assets/js/feed-core.js"
      - "assets/js/article-sync.js"
      - ".github/workflows/update-research-feed.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: research-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scan sources
        run: node scripts/update-research-feed.mjs

      - name: Commit snapshot
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Pages/Research/data/feed.json Pages/Research/data/feed-archive.json Pages/Research/data/articles-feed.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update research feed snapshot"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start the
      # Pages deployment explicitly.
      - name: Redeploy site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run static.yml --ref main
