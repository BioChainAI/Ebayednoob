<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometric Harmonics Calculator - Ebayednoob</title>
    <meta name="description" content="Geometric Harmonics Calculator: the 6-channel, 5-tier toroidal orbital calculator of the Geometric Engine of Time.">
    <!--
        Shell page. The calculator itself lives, unmodified, in calculator.html and runs in the frame below;
        the Home button, Google sign-in and social links come from assets/js/page-chrome.js.
        To install a new revision, replace calculator.html with the new file. Nothing else changes.
    -->
    <style>
        html, body { margin: 0; height: 100%; background: #020617; overflow: hidden; }
        #app-frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
    </style>
</head>
<body>
    <iframe id="app-frame" src="calculator.html" title="Geometric Harmonics Calculator" allow="fullscreen; clipboard-read; clipboard-write"></iframe>

    <script>
        // Give the calculator keyboard focus and carry its own title up to the browser tab.
        const frame = document.getElementById("app-frame");
        frame.addEventListener("load", () => {
            frame.focus();
            try {
                const t = frame.contentDocument?.title;
                if (t) document.title = t;
            } catch { /* not same-origin (e.g. opened from file://) */ }
        });
    </script>
    <script type="module" src="../../assets/js/page-chrome.js" data-position="top"></script>
</body>
</html>
