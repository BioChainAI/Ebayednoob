# Hyperbolic Lexicon reference tests. From this folder:
#   python3 -B -m pytest -q -p no:cacheprovider                       the fast suite (slow tests deselected)
#   python3 -B -m pytest -q -p no:cacheprovider -m slow               only the slow full-corpus checks
#   python3 -B -m pytest -q -p no:cacheprovider -m "slow or not slow" everything
[pytest]
testpaths = tests
markers =
    slow: full-corpus checks that take longer than the fast suite; deselected unless -m selects them
addopts = -m "not slow"
